[colors.primary]
background = "{background}"
foreground = "{foreground}"

[colors.normal]
black   = "{color0}"
red     = "{color1}"
green   = "{color2}"
yellow  = "{color3}"
blue    = "{color4}"
magenta = "{color5}"
cyan    = "{color6}"
white   = "{color7}"

[colors.bright]
black   = "{color8}"
red     = "{color9}"
green   = "{color10}"
yellow  = "{color11}"
blue    = "{color12}"
magenta = "{color13}"
cyan    = "{color14}"
white   = "{color15}"

# Mappatura dello schema dwm / C (SchemeNorm e SchemeSel)
[colors.selection]
text       = "{foreground}"  # sel_fg
background = "{color4}"      # sel_bg

[colors.search.matches]
foreground = "{foreground}"  # urg_fg
background = "{color1}"      # urg_bg
